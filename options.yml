options:
- category:
  - '{{trail_category}}'
  name: firstedition
  display: GroupBox
  header: '{{option_1_header}}'
  text: '{{option_1_text}}'
  hasHeader: true
  children:
  - name: source
    text: '{{trail_source_text}}'
    display: FileInput
    url: custom-skirmish-trails.firstedition.source.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
- category:
  - '{{trail_category}}'
  name: warchest
  display: GroupBox
  header: '{{option_2_header}}'
  text: '{{option_2_text}}'
  hasHeader: true
  children:
  - name: source
    text: '{{trail_source_text}}'
    display: FileInput
    url: custom-skirmish-trails.warchest.source.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
- category:
  - '{{trail_category}}'
  name: extremetrail
  display: GroupBox
  header: '{{option_3_header}}'
  text: '{{option_3_text}}'
  hasHeader: true
  children:
  - name: source
    text: '{{trail_source_text}}'
    display: FileInput
    url: custom-skirmish-trails.extremetrail.source.path
    contents:
      generalizeExtensionPaths: true
      filter: files
      type: string
      value: ''
- category:
  - '{{trail_category}}'
  name: strict_format
  hidden: true
  hasHeader: false
  header: '{{option_4_header}}'
  text: '{{option_4_text}}'
  display: UCP2Switch
  url: custom-skirmish-trails.csv.strict_format
  contents:
    type: boolean
    value: false
meta:
  version: 1.0.0